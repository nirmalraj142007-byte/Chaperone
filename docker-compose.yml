services:
  ddb:
    image: amazon/dynamodb-local:latest
    container_name: chaperone-ddb
    # The image's default user (dynamodblocal, uid 1000) can't write into a
    # freshly-created named volume, which Docker mounts owned by root:root —
    # DynamoDB Local's SQLite backend then fails with "unable to open
    # database file" in an infinite reconnect loop, hanging every real
    # request forever without ever erroring back to the client. Running the
    # container as root sidesteps that permission mismatch; there's no
    # privilege-drop step in the image's own entrypoint to preserve anyway.
    user: root
    working_dir: /home/dynamodblocal
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    ports:
      - "8000:8000"
    volumes:
      - ddb-data:/home/dynamodblocal/data

  demo-upstream:
    build:
      context: .
      dockerfile: docker/demo-upstream.Dockerfile
    container_name: chaperone-demo-upstream
    environment:
      PORT: "4000"
    ports:
      - "4000:4000"

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
      args:
        # Populated from the shell so /healthz can report the commit it is
        # actually running. `docker compose build` with these unset leaves
        # the Dockerfile's "unknown" default, which is the honest answer
        # rather than a wrong one. `pnpm stack:up` sets them.
        CHAPERONE_COMMIT: ${CHAPERONE_COMMIT:-unknown}
        CHAPERONE_VERSION: ${CHAPERONE_VERSION:-0.0.0}
    container_name: chaperone-gateway
    depends_on:
      - ddb
      - demo-upstream
    environment:
      PORT: "3000"
      # BIND_ALL=true: the container's own loopback interface is not what
      # docker-compose's port mapping below reaches — see security.ts.
      BIND_ALL: "true"
      AWS_REGION: us-east-1
      DDB_ENDPOINT: http://ddb:8000
      DDB_TABLE_PREFIX: chaperone
      HOUSEHOLD_ID: household-demo
      CHAPERONE_UPSTREAMS: '[{"id":"grocery","url":"http://demo-upstream:4000/mcp","label":"Household Grocery"}]'
    ports:
      - "3000:3000"

volumes:
  ddb-data:
