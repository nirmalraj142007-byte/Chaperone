User tinyproxy
Group tinyproxy
Port 3128
Listen 0.0.0.0
Timeout 120

# Any client on the internal crawl network may use this proxy — the internal
# network itself is the access control (it has no other route out, and
# nothing but boot-harness containers and this proxy are ever attached to
# it). 172.28.0.0/16 is the fixed subnet docker/README.md's `docker network
# create` command assigns to chaperone-crawl-internal.
Allow 172.28.0.0/16
Allow 127.0.0.1

# Deny everything not explicitly listed in ./filter — this is the actual
# egress allowlist for boot attempts: package registries only. Verified
# empirically against tinyproxy 1.11.2 on 2026-09-13 — its real directive
# names diverge from its own upstream docs/changelog wording ("FilterDefault
# deny" errors; the working form is "FilterDefaultDeny yes"), and the filter
# file path must be quoted or the config parser rejects the line outright.
FilterDefaultDeny yes
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterCaseSensitive no

LogLevel Info
